name: A16 validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The fixed historical component/impact baseline must remain reachable as the branch grows.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Internal package metadata reader and synthetic CNMT boundary tests
        run: |
          dotnet build dm/tools/nx_extract -c Release --nologo
          dotnet run --project dm/tools/tests/cnmt -c Release
          python -m unittest dm/tools/tests/test_nsp_scan.py dm/tools/tests/test_nsp_nsz.py dm/tools/tests/test_nsp_external_drive.py dm/tools/tests/test_nsp_incremental.py
      - run: python -m pip install texture2ddecoder Pillow unicorn
      - name: Live quality controller and executable AArch64 guest fixtures
        run: |
          clang -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_memory.c -o /tmp/memory
          /tmp/memory
          clang -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_pretrim.c -o /tmp/pretrim
          /tmp/pretrim
          clang -O2 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_sbw_range.c -o /tmp/sbw-range
          /tmp/sbw-range
          clang -O2 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_upload_window.c -o /tmp/upload-window
          /tmp/upload-window
          clang -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_sampler_quality.c -lm -o /tmp/sampler-quality
          /tmp/sampler-quality
          clang -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_archive_route.c -o /tmp/archive-route
          /tmp/archive-route
          clang -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined dm/gfx/tests/t_tuning.c dm/gfx/nvn/nvn_tuning.c -lm -o /tmp/tuning
          /tmp/tuning
          clang -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined dm/gfx/tests/t_romfs_overlay.c dm/host/hle_romfs_overlay.c -o /tmp/overlay
          /tmp/overlay
          python -m unittest -v dm/tools/tests/test_botw_live_stubs.py
      - name: Exact BC upload bytes, independent ASTC decode, odd mips and pitches
        run: python -m unittest -v dm/gfx/tests/test_bc_soft.py
      - name: Serial component benchmark (no gameplay claims)
        run: python scripts/bench_bc.py > bc-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bc-component-benchmark
          path: bc-benchmark.json
          retention-days: 7
      - name: Bounded asynchronous trace under ASan and UBSan
        run: |
          clang -O2 -g -pthread -fsanitize=address,undefined -DNVN_STUTTER_LIMIT=8192 dm/gfx/tests/t_stutter.c dm/gfx/nvn/nvn_stutter.c -o /tmp/stutter
          /tmp/stutter
          /tmp/stutter on
          /tmp/stutter normal
          python -m unittest dm/tools/tests/test_stutter_analyze.py
      - name: Presentation statistics under ASan and UBSan
        run: |
          clang -O2 -g -pthread -fsanitize=address,undefined dm/gfx/tests/t_frame_metrics.c dm/gfx/nvn/nvn_frame_metrics.c -o /tmp/frame-metrics
          /tmp/frame-metrics
  apple:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify installed toolchain fingerprints
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos metal --version
          python3 dm/gfx/tools/dmsh_chain.py --check-tools
      - name: Static impact report (no game files)
        run: python3 scripts/regress.py impact 269d61ff974b2e8e073d7357466ae130c3f6812f..HEAD --out "$RUNNER_TEMP/a16-impact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-impact
          path: ${{ runner.temp }}/a16-impact
          retention-days: 7
      - name: Bounded learned preparation selection
        run: |
          clang -O2 -fobjc-arc dm/gfx/tests/t_warm_budget.m -framework Foundation -o /tmp/warm-budget
          /tmp/warm-budget
      - name: Actual persistent cache, owned writes and memory pressure
        run: |
          clang -O2 -g -fobjc-arc -fblocks -fsanitize=address,undefined dm/gfx/tex/tests/t_bc_cache.m dm/gfx/tex/bc_cache.m dm/gfx/tex/bc_soft.c -framework Foundation -o /tmp/bc-cache
          /tmp/bc-cache
      - name: Presentation statistics under ThreadSanitizer
        run: |
          clang -O1 -g -pthread -fsanitize=thread dm/gfx/tests/t_frame_metrics.c dm/gfx/nvn/nvn_frame_metrics.c -o /tmp/frame-metrics
          /tmp/frame-metrics
      - name: Bounded asynchronous trace under ThreadSanitizer
        run: |
          clang -O1 -g -pthread -fsanitize=thread -DNVN_STUTTER_LIMIT=8192 dm/gfx/tests/t_stutter.c dm/gfx/nvn/nvn_stutter.c -o /tmp/stutter
          /tmp/stutter
          /tmp/stutter on
          /tmp/stutter normal
